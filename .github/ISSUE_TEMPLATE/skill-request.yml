name: Skill request
description: Suggest a new money ops skill or an improvement to one
labels: ["skill request"]
body:
  - type: input
    id: job
    attributes:
      label: The question
      description: What money question or recurring household task should an agent handle?
      placeholder: "e.g. Should we refinance the car loan or pay it down?"
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: What you'd hand it
      description: Pay stubs, statements, a budget, a benefits guide — what goes in? Please don't include account numbers or personal details here.
  - type: textarea
    id: output
    attributes:
      label: What you'd want back
      description: The finished thing, as specifically as you can describe it
  - type: input
    id: existing
    attributes:
      label: Closest existing skill
      description: If one of the current skills almost does this, which one?
